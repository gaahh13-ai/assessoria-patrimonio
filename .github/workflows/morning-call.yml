name: Morning Call diário

# Horários (Brasília, BRT = UTC-3):
# main – 5:45 dias úteis → página completa (data, resumo, notícias + tudo).
# Disparado por serviço externo (cron-job.org) via workflow_dispatch,
# que é mais pontual que o schedule nativo do GitHub.
# focus – segunda 9:30 → só o Boletim Focus (schedule nativo abaixo, em UTC).
#
# Os modos market/agenda continuam disponíveis para disparo MANUAL (input "mode"),
# mas não têm mais horário automático — foram removidos para enxugar custo.
#
# Resiliência: se a geração falhar, envia e-mail (FormSubmit), espera 15 min,
# tenta gerar de novo e, se falhar outra vez, envia um segundo e-mail.
on:
  schedule:
    - cron: "30 12 * * 1"    # focus · 09:30 BRT (segunda)
  workflow_dispatch:
    inputs:
      force:
        description: "Forçar geração mesmo em fim de semana"
        type: boolean
        default: false
      mode:
        description: "Modo de atualização"
        type: choice
        default: main
        options: [main, market, focus, agenda]

permissions:
  contents: write

concurrency:
  group: morning-call
  cancel-in-progress: false

env:
  NOTIFY_URL: "https://formsubmit.co/ajax/gaahh.13@gmail.com"

jobs:
  gerar-e-publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Definir o modo
        id: mode
        run: |
          MODE="${{ inputs.mode || (github.event.schedule == '30 12 * * 1' && 'focus') || 'main' }}"
          echo "value=$MODE" >> "$GITHUB_OUTPUT"
          echo "Modo: $MODE"

      - name: Gerar o Morning Call (tentativa 1)
        id: gen1
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-haiku-4-5-20251001
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
          FORCE_RUN: ${{ inputs.force }}
          MODE: ${{ steps.mode.outputs.value }}
        run: python generate_morning_call.py

      - name: Avisar por e-mail (falhou a 1ª tentativa)
        if: steps.gen1.outcome == 'failure'
        run: |
          MODE="${{ steps.mode.outputs.value }}"
          AGORA="$(TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M')"
          curl -s -X POST "$NOTIFY_URL" \
            -d "_subject=Morning Call nao atualizou (1a tentativa) - modo $MODE" \
            -d "mensagem=A geracao automatica (modo $MODE) falhou em $AGORA. Vou tentar novamente em 15 minutos e aviso se nao der certo." \
            -d "_template=table" || true

      - name: Esperar 15 minutos antes de tentar de novo
        if: steps.gen1.outcome == 'failure'
        run: sleep 900

      - name: Gerar o Morning Call (tentativa 2)
        id: gen2
        if: steps.gen1.outcome == 'failure'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-haiku-4-5-20251001
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
          FORCE_RUN: ${{ inputs.force }}
          MODE: ${{ steps.mode.outputs.value }}
        run: python generate_morning_call.py

      - name: Avisar por e-mail (falhou a 2ª tentativa)
        if: steps.gen1.outcome == 'failure' && steps.gen2.outcome == 'failure'
        run: |
          MODE="${{ steps.mode.outputs.value }}"
          AGORA="$(TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M')"
          curl -s -X POST "$NOTIFY_URL" \
            -d "_subject=Morning Call segue sem atualizar (apos 2 tentativas) - modo $MODE" \
            -d "mensagem=A segunda tentativa (modo $MODE) tambem falhou em $AGORA. A pagina NAO foi atualizada; a ultima edicao valida continua no ar. Voce pode rodar manualmente pela aba Actions do GitHub." \
            -d "_template=table" || true

      - name: Publicar (commit e push se houve mudança)
        if: steps.gen1.outcome == 'success' || steps.gen2.outcome == 'success'
        run: |
          git config user.name "morning-call-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sem alterações no Morning Call."
          else
            git commit -m "Atualiza Morning Call ($(TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M'))"
            git push
            echo "Morning Call publicado."
          fi

      - name: Marcar execução como falha (ambas tentativas falharam)
        if: steps.gen1.outcome == 'failure' && steps.gen2.outcome == 'failure'
        run: |
          echo "Ambas as tentativas de geração falharam."
          exit 1
