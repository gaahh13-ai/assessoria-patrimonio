name: Morning Call diário

# O agendamento diário (05:53, dias úteis) é feito por um serviço externo
# (cron-job.org) que aciona este workflow via a API de workflow_dispatch.
# Além disso, o "schedule" nativo abaixo dispara a rodada extra de segunda-feira
# às 09:30 (horário de Brasília = 12:30 UTC) que atualiza SOMENTE o Boletim Focus.
# Também pode ser disparado manualmente pela aba "Actions".
on:
  schedule:
    - cron: "30 12 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Forçar geração mesmo em fim de semana"
        type: boolean
        default: false
      focus_only:
        description: "Atualizar somente o Boletim Focus (rodada das 9:30 de segunda)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: morning-call
  cancel-in-progress: false

jobs:
  gerar-e-publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar o Morning Call
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-haiku-4-5-20251001
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
          FORCE_RUN: ${{ inputs.force }}
          FOCUS_ONLY: ${{ inputs.focus_only || github.event_name == 'schedule' }}
        run: python generate_morning_call.py

      - name: Publicar (commit e push se houve mudança)
        run: |
          git config user.name "morning-call-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sem alterações no Morning Call."
          else
            git commit -m "Atualiza Morning Call ($(TZ='America/Sao_Paulo' date '+%d/%m/%Y'))"
            git push
            echo "Morning Call publicado."
          fi
