name: Morning Call diário

# O agendamento é feito por um serviço externo (cron-job.org) que aciona este workflow
# pontualmente às 05:53 (horário de Brasília), dias úteis, via a API de workflow_dispatch.
# Também pode ser disparado manualmente pela aba "Actions".
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morning-call
  cancel-in-progress: false

jobs:
  gerar-e-publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar o Morning Call
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-haiku-4-5-20251001
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
        run: python generate_morning_call.py

      - name: Publicar (commit e push se houve mudança)
        run: |
          git config user.name "morning-call-bot"
          git config user.email "actions@github.com"
          git add index.html historico.json historico
          if git diff --cached --quiet; then
            echo "Sem alterações no Morning Call."
          else
            git commit -m "Atualiza Morning Call ($(TZ='America/Sao_Paulo' date '+%d/%m/%Y'))"
            git push
            echo "Morning Call publicado."
          fi
