name: Morning Call diário

# Horários (Brasília, BRT = UTC-3):
#   main   – 5:45 dias úteis  → página completa (data, resumo, notícias + tudo).
#            Disparado por serviço externo (cron-job.org) via workflow_dispatch,
#            que é mais pontual que o schedule nativo do GitHub.
#   market – 13:00 e 18:30 dias úteis → só Painel de Mercado + Destaques B3.
#   focus  – segunda 9:30 → só o Boletim Focus.
#   agenda – sexta 18:30 → só a Agenda da Semana (referente à semana seguinte).
# Os modos market/focus/agenda usam o schedule nativo abaixo (UTC).
on:
  schedule:
    - cron: "0 16 * * 1-5"    # market · 13:00 BRT (dias úteis)
    - cron: "30 21 * * 1-5"   # market · 18:30 BRT (dias úteis)
    - cron: "30 12 * * 1"     # focus  · 09:30 BRT (segunda)
    - cron: "30 21 * * 5"     # agenda · 18:30 BRT (sexta)
  workflow_dispatch:
    inputs:
      force:
        description: "Forçar geração mesmo em fim de semana"
        type: boolean
        default: false
      mode:
        description: "Modo de atualização"
        type: choice
        default: main
        options: [main, market, focus, agenda]

permissions:
  contents: write

concurrency:
  group: morning-call
  cancel-in-progress: false

jobs:
  gerar-e-publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar o Morning Call
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-haiku-4-5-20251001
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
          FORCE_RUN: ${{ inputs.force }}
          MODE: >-
            ${{ inputs.mode
                || (github.event.schedule == '30 12 * * 1' && 'focus')
                || (github.event.schedule == '30 21 * * 5' && 'agenda')
                || (github.event.schedule && 'market')
                || 'main' }}
        run: python generate_morning_call.py

      - name: Publicar (commit e push se houve mudança)
        run: |
          git config user.name "morning-call-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sem alterações no Morning Call."
          else
            git commit -m "Atualiza Morning Call ($(TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M'))"
            git push
            echo "Morning Call publicado."
          fi
